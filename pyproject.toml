[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imgbb-image-mirror"
version = "0.1.0"
description = "Mirror supported image albums to imgbb with resume metadata."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "playwright>=1.40",
]

[project.scripts]
imgbb-image-mirror = "imgbb_image_mirror.__main__:main"
imgbb-scraper = "imgbb_image_mirror.__main__:main"

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
